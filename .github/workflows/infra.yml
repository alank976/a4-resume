name: infra

# Plans on pull requests and applies on main, for changes under infra/.
on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write # to rebuild the site after the domain changes

# R2 has no state locking, so never run two Terraform jobs at once.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  # R2 credentials for the state bucket (S3-compatible API).
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # R2 rejects the checksums newer AWS SDKs send by default.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # Fine-grained token that can change this repository's Pages settings.
  GITHUB_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}

defaults:
  run:
    working-directory: infra

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for name in ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CLOUDFLARE_API_TOKEN GITHUB_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets for:$missing. See infra/README.md, One-time setup."
            exit 1
          fi
        working-directory: .
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.17"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - name: terraform init
        run: >-
          terraform init
          -backend-config="endpoints={s3=\"https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - name: terraform apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply tfplan
      - name: Rebuild the site so its links use the new domain
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
